name: Download YouTube video

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Video or playlist URL'
        required: true
      format:
        description: 'Format: video (mp4) or audio-only (mp3)'
        required: false
        default: 'video'
        type: choice
        options:
          - video
          - audio
      hf_namespace:
        description: 'Your Hugging Face username or organization'
        required: true
      hf_bucket:
        description: 'Hugging Face bucket name (created automatically)'
        required: false
        default: 'video-downloads'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      # yt-dlp needs a JS runtime for YouTube's PO-token checks
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Fetch all tools in parallel: standalone yt-dlp binary + static ffmpeg
      # (avoids slow pip/apt) + huggingface_hub CLI for the upload.
      # Note: the "sleep N seconds as required by the site" wait must be
      # honored - YouTube gates the stream URLs behind it and returns 403 if
      # it is skipped on datacenter IPs.
      - name: Prepare tools
        run: |
          set -e
          (
            curl -sL --max-time 90 -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
            chmod +x yt-dlp
          ) &
          (
            mkdir -p ffmpeg-bin
            curl -sL --max-time 120 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            cp "$(find /tmp -maxdepth 3 -name ffmpeg -type f | head -1)" ffmpeg-bin/
            cp "$(find /tmp -maxdepth 3 -name ffprobe -type f | head -1)" ffmpeg-bin/
          ) &
          pipx install -q huggingface_hub &
          wait
          export PATH="$PWD:$HOME/.local/bin:$PWD/ffmpeg-bin:$PATH"
          ./yt-dlp --version
          ffmpeg -version | head -1
          hf --version || true

      # Optional: decode browser cookies from the YT_COOKIES secret
      # (base64 of your cookies.txt) so YouTube doesn't block the runner.
      - name: Set up cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 -d > cookies.txt
          fi

      - name: Download video
        run: |
          export PATH="$PWD:$HOME/.local/bin:$PWD/ffmpeg-bin:$PATH"
          COOKIES_ARGS=""
          if [ -f cookies.txt ]; then
            COOKIES_ARGS="--cookies cookies.txt"
          fi
          if [ "${{ inputs.format }}" == "audio" ]; then
            FMT="-f ba/b -x --audio-format mp3"
          else
            FMT="-f bv*+ba/b --merge-output-format mp4"
          fi
          # Force web_embedded: its stream URLs download instantly (the tv/
          # default clients gate their URLs behind the ad-wait and 403 if
          # skipped). Try progressively more compatible clients on failure.
          for client in web_embedded web_safari default; do
            echo "--- trying client: $client ---"
            if yt-dlp --remote-components ejs:github $COOKIES_ARGS \
              --extractor-args "youtube:player_client=$client" \
              $FMT -o "download.%(ext)s" "${{ inputs.url }}"; then
              break
            fi
          done

      - name: Upload to Hugging Face bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ inputs.format }}" == "audio" ]; then
            FILE="download.mp3"
          else
            FILE="download.mp4"
          fi
          BUCKET="${{ inputs.hf_namespace }}/${{ inputs.hf_bucket }}"
          DEST="hf://buckets/$BUCKET/video-$(date +%Y%m%d-%H%M%S).${FILE##*.}"

          # Create the bucket if it doesn't exist yet (private by default)
          hf buckets create "$BUCKET" --private 2>/dev/null || echo "Bucket already exists"

          hf buckets cp "$FILE" "$DEST"
          echo "Uploaded to: $DEST"