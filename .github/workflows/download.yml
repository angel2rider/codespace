name: Download YouTube video

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Video or playlist URL'
        required: true
      format:
        description: 'Format: video (mp4) or audio-only (mp3)'
        required: false
        default: 'video'
        type: choice
        options:
          - video
          - audio
      hf_namespace:
        description: 'Your Hugging Face username or organization'
        required: true
      hf_bucket:
        description: 'Hugging Face bucket name (created automatically)'
        required: false
        default: 'video-downloads'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # yt-dlp needs a JS runtime for YouTube's PO-token checks
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # All tools fetched in parallel: standalone yt-dlp binary + static
      # ffmpeg (avoids slow pipx/apt) + huggingface_hub CLI for the upload.
      - name: Prepare tools
        run: |
          set -e
          (
            curl -sL --max-time 90 -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
            chmod +x yt-dlp
          ) &
          (
            mkdir -p ffmpeg-bin
            curl -sL --max-time 120 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ff.tar.xz -C ffmpeg-bin --strip-components=1 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          ) &
          pipx install -q huggingface_hub &
          wait
          export PATH="$PWD/ffmpeg-bin:$PATH"
          ffmpeg -version | head -1
          ./yt-dlp --version

      # Optional: decode browser cookies from the YT_COOKIES secret
      # (base64 of your cookies.txt) so YouTube doesn't block the runner.
      - name: Set up cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 -d > cookies.txt
          fi

      - name: Download video
        run: |
          export PATH="$PWD/ffmpeg-bin:$PATH"
          COOKIES_ARGS=""
          if [ -f cookies.txt ]; then
            COOKIES_ARGS="--cookies cookies.txt"
          fi
          if [ "${{ inputs.format }}" == "audio" ]; then
            FMT="-f ba/b -x --audio-format mp3"
          else
            FMT="-f bv*+ba/b --merge-output-format mp4"
          fi
          # web_embedded skips YouTube's ad-wait sleep (~15-19s) at equal quality.
          # Fall back to the default client (handles multiple player responses)
          # if a particular video is unavailable via web_embedded.
          run_dl() {
            ./yt-dlp --remote-components ejs:github $COOKIES_ARGS \
              --extractor-args "youtube:player_client=$1" \
              $FMT -o "download.%(ext)s" "${{ inputs.url }}"
          }
          run_dl web_embedded || run_dl default

      - name: Upload to Hugging Face bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ inputs.format }}" == "audio" ]; then
            FILE="download.mp3"
          else
            FILE="download.mp4"
          fi
          BUCKET="${{ inputs.hf_namespace }}/${{ inputs.hf_bucket }}"
          DEST="hf://buckets/$BUCKET/video-$(date +%Y%m%d-%H%M%S).${FILE##*.}"

          # Create the bucket if it doesn't exist yet (private by default)
          hf buckets create "$BUCKET" --private 2>/dev/null || echo "Bucket already exists"

          hf buckets cp "$FILE" "$DEST"
          echo "Uploaded to: $DEST"