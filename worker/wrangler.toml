name = "yt-dl-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "cc4668baab24a44ebe315a3807279d15"

[vars]
WORKER_URL = "https://yt-dl-worker.vivekpereiraalbert.workers.dev"

[observability]
enabled = true

# Strongly-consistent probe job queue (KV was too slow/stale for handoff).
[[durable_objects.bindings]]
name = "PROBE_QUEUE"
class_name = "ProbeQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProbeQueue"]

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.client.js"]
fallthrough = true
