name: Probe formats

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Video URL'
        required: true
      nonce:
        description: 'Unique id for this probe (used for the result key)'
        required: true
      callback:
        description: 'Worker base URL to POST the result to'
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # yt-dlp needs a JS runtime for YouTube's PO-token checks
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Get yt-dlp
        run: |
          curl -sL --max-time 90 -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          chmod +x yt-dlp
          ./yt-dlp --version

      - name: Set up cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" | base64 -d > cookies.txt
          fi

      - name: Dump available formats
        run: |
          export PATH="$PWD:$PATH"
          COOKIES_ARGS=""
          if [ -f cookies.txt ]; then
            COOKIES_ARGS="--cookies cookies.txt"
          fi
          # -J dumps metadata (formats, title, thumbnail, duration) without downloading
          ./yt-dlp --remote-components ejs:github $COOKIES_ARGS -J "${{ inputs.url }}" > meta.json
          jq '{title, id, thumbnail, duration,
               resolutions: ([.formats[]
                 | select(.height != null)
                 | select((.vcodec // "none") != "none")
                 | select(.protocol != "m3u8_native")
                 | {h: .height, fps: (.fps // 0)}]
                 | group_by(.h)
                 | map({h: .[0].h, fps: (map(.fps) | max)})
                 | sort_by(-.h))}' meta.json > probe.json
          jq -s '.[0] * {nonce: .[1].nonce}' probe.json <(echo '{"nonce": "${{ inputs.nonce }}"}') > payload.json
          cat payload.json

      - name: Post result to Worker
        run: |
          HTTP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "${{ inputs.callback }}/api/probe/result" \
            -H "Content-Type: application/json" \
            -H "x-probe-secret: ${{ secrets.WORKER_SECRET }}" \
            --data-binary @payload.json)
          echo "Worker responded: $HTTP"
          cat /tmp/resp.txt
          test "$HTTP" == "200"